<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rifa - Carlos & Caroline</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#f6f5f2;

}

.topo{

background:#48613c;
color:white;
padding:25px;
text-align:center;

}

.topo h1{

margin:0;

}

.topo p{

margin-top:10px;

}

.info{

display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin:25px;

}

.card{

background:white;
padding:15px 25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
font-weight:bold;

}

#numeros{

display:grid;
grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
gap:10px;

padding:20px;
max-width:900px;
margin:auto;

}

.numero{

padding:15px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
background:#5f7c53;
color:white;
transition:.2s;

}

.numero:hover{

transform:scale(1.05);

}

.reservado{

background:#d9534f;
cursor:not-allowed;

}

#janela{

display:none;

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.55);

justify-content:center;
align-items:center;

}

.caixa{

background:white;

padding:30px;

border-radius:20px;

width:90%;
max-width:400px;

}

.caixa h2{

margin-top:0;

color:#48613c;

}

input{

width:100%;

padding:12px;

margin-top:10px;

margin-bottom:15px;

border-radius:8px;

border:1px solid #ccc;

font-size:16px;

}

.botao{

width:100%;

padding:15px;

border:none;

border-radius:10px;

background:#48613c;

color:white;

font-size:18px;

cursor:pointer;

}

.botao:hover{

background:#35502c;

}

.fechar{

margin-top:15px;

background:#999;

}

</style>

</head>

<body>

<div class="topo">

<h1>🎟️ Rifa Carlos & Caroline</h1>

<p>

Escolha seu número.

Cada número custa <b>R$ 10,00</b>.

</p>

</div>

<div class="info">

<div class="card">

🟢 Disponíveis:
<span id="livres">0</span>

</div>

<div class="card">

🔴 Reservados:
<span id="ocupados">0</span>

</div>

</div>

<div id="numeros">

Carregando...

</div>

<div id="janela">

<div class="caixa">

<h2 id="tituloNumero">

Número

</h2>

<input
id="nome"
placeholder="Seu nome">

<input
id="telefone"
placeholder="Telefone">

<button
class="botao"
id="reservar">

Reservar número

</button>

<button
class="botao fechar"
onclick="fecharJanela()">

Cancelar

</button>

</div>

</div>

<script type="module">

import { initializeApp }

from

"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {

getFirestore,

collection,

getDocs,

doc,

updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyB9wtBnxQd7E_GVjb-E5E38s_PcqiGoDm8",

authDomain:"casamento-carlos-caroline.firebaseapp.com",

projectId:"casamento-carlos-caroline",

storageBucket:"casamento-carlos-caroline.firebasestorage.app",

messagingSenderId:"565370188929",

appId:"1:565370188929:web:bf5bb21e3a6067801bc980"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

let documentoSelecionado=null;

function fecharJanela(){

document.getElementById("janela").style.display="none";

}

window.fecharJanela=fecharJanela;
    async function carregarNumeros(){

const area=document.getElementById("numeros");

area.innerHTML="";

let livres=0;
let ocupados=0;

const consulta=await getDocs(collection(db,"Rifa"));

const lista=[];

consulta.forEach((item)=>{

lista.push({

id:item.id,

...item.data()

});

});

lista.sort((a,b)=>a.numero-b.numero);

lista.forEach((dados)=>{

const botao=document.createElement("button");

botao.innerHTML=String(dados.numero).padStart(3,"0");

botao.className="numero";

if(dados.status==="reservado"){

botao.classList.add("reservado");

botao.disabled=true;

ocupados++;

}else{

livres++;

botao.onclick=()=>{

documentoSelecionado=dados.id;

document.getElementById("tituloNumero").innerHTML=

"Número "+String(dados.numero).padStart(3,"0");

document.getElementById("nome").value="";

document.getElementById("telefone").value="";

document.getElementById("janela").style.display="flex";

};

}

area.appendChild(botao);

});

document.getElementById("livres").innerHTML=livres;

document.getElementById("ocupados").innerHTML=ocupados;

}

carregarNumeros();

document.getElementById("reservar").onclick=async()=>{

const nome=document.getElementById("nome").value.trim();

const telefone=document.getElementById("telefone").value.trim();

if(nome===""){

alert("Informe seu nome.");

return;

}

if(telefone===""){

alert("Informe seu telefone.");

return;

}

await updateDoc(

doc(db,"Rifa",documentoSelecionado),

{

Nome:nome,

Telefone:telefone,

status:"reservado"

}

);

alert("Número reservado com sucesso! 🎉");

fecharJanela();

carregarNumeros();

};

</script>

</body>

</html>
