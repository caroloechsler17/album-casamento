<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rifa - Carlos & Caroline</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, Helvetica, sans-serif;
    background:#f6f5f2;
    color:#333;

}

header{

    background:#5f7c53;
    color:white;
    padding:25px;
    text-align:center;

}

header h1{

    margin-bottom:10px;

}

.container{

    max-width:1200px;
    margin:auto;
    padding:25px;

}

.informacoes{

    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:30px;

}

.card{

    background:white;
    border-radius:15px;
    padding:20px;
    width:180px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.card h2{

    font-size:34px;
    color:#48613c;

}

.card p{

    margin-top:8px;

}

#numeros{

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
    gap:10px;

}

.numero{

    background:#4CAF50;
    color:white;
    border-radius:10px;
    padding:15px 5px;
    text-align:center;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;

}

.numero:hover{

    transform:scale(1.05);

}

.reservado{

    background:#d9534f !important;
    cursor:not-allowed;

}

.selecionado{

    background:#f0ad4e !important;

}

#modal{

    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);

    display:none;

    justify-content:center;
    align-items:center;

}

.modal-content{

    background:white;
    padding:30px;
    width:90%;
    max-width:400px;
    border-radius:15px;

}

.modal-content h2{

    margin-bottom:20px;
    color:#48613c;

}

input{

    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;

}

button{

    width:100%;
    border:none;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    background:#5f7c53;
    color:white;
    font-size:18px;

}

button:hover{

    background:#48613c;

}

.cancelar{

    margin-top:10px;
    background:#999;

}

.cancelar:hover{

    background:#777;

}

.voltar{

display:inline-block;
margin:20px;
background:#5f7c53;
color:white;
padding:10px 18px;
border-radius:20px;
text-decoration:none;
font-size:16px;

}

</style>

</head>

<body>

<header>

<h1>🎟️ Rifa do Casamento</h1>

<p>Carlos ❤️ Caroline</p>

<p>
Participe da nossa rifa!  
<br>
Cada número tem o valor de <strong>R$ 10,00</strong>.
</p>

</header>

<a class="voltar" href="index.html">← Voltar</a>

<div class="container">

<div class="informacoes">

<div class="card">

<h2 id="livres">0</h2>

<p>Disponíveis</p>

</div>

<div class="card">

<h2 id="ocupados">0</h2>

<p>Reservados</p>

</div>

</div>

<div id="numeros"></div>

</div>


<div id="modal">

<div class="modal-content">

<h2 id="tituloNumero"></h2>

<input
id="nome"
type="text"
placeholder="Seu nome">

<input
id="telefone"
type="text"
placeholder="Telefone">

<button id="reservar">

Reservar número

</button>

<button
class="cancelar"
onclick="fecharModal()">

Cancelar

</button>

</div>

</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDocs,
    collection,
    updateDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyB9wtBnxQd7E_GVjb-E5E38s_PcqiGoDm8",

    authDomain: "casamento-carlos-caroline.firebaseapp.com",

    projectId: "casamento-carlos-caroline",

    storageBucket: "casamento-carlos-caroline.firebasestorage.app",

    messagingSenderId: "565370188929",

    appId: "1:565370188929:web:bf5bb21e3a6067801bc980"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const lista = document.getElementById("numeros");

let numeroSelecionado = "";

function abrirModal(numero){

    numeroSelecionado = numero;

    document.getElementById("tituloNumero").innerHTML =
        "Número " + numero;

    document.getElementById("nome").value="";

    document.getElementById("telefone").value="";

    document.getElementById("modal").style.display="flex";

}

window.fecharModal = function(){

    document.getElementById("modal").style.display="none";

}
    function carregarNumeros() {

    onSnapshot(collection(db, "Rifa"), (snapshot) => {

        lista.innerHTML = "";

        let livres = 0;
        let ocupados = 0;

        snapshot.docs
            .sort((a, b) => Number(a.id) - Number(b.id))
            .forEach((documento) => {

                const dados = documento.data();

                const numero = documento.id;

                const status = dados.status;

                const div = document.createElement("div");

                div.className = "numero";

                div.innerHTML = numero;

                if (status === "disponível") {

                    livres++;

                    div.onclick = () => abrirModal(numero);

                } else {

                    ocupados++;

                    div.classList.add("reservado");

                }

                lista.appendChild(div);

            });

        document.getElementById("livres").innerHTML = livres;

        document.getElementById("ocupados").innerHTML = ocupados;

    });

}

carregarNumeros();

document.getElementById("reservar").addEventListener("click", async () => {

    const nome = document.getElementById("nome").value.trim();

    const telefone = document.getElementById("telefone").value.trim();

    if (nome === "" || telefone === "") {

        alert("Preencha todos os campos.");

        return;

    }

    const referencia = doc(db, "Rifa", numeroSelecionado);

        try {

        await updateDoc(referencia, {

            Nome: nome,
            Telefone: telefone,
            status: "reservado"

        });

        alert("Número reservado com sucesso! 🎉");

        fecharModal();

    } catch (erro) {

        console.error(erro);

        alert("Ocorreu um erro ao reservar o número.");

    }

});

</script>

</body>

</html>
