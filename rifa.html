<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rifa - Carlos & Caroline</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f6f5f2;
    padding:20px;
}

.card{

    background:white;
    max-width:600px;
    margin:auto;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

h1{
    color:#48613c;
}

p{
    font-size:18px;
}

.numeros{

    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-top:25px;

}

.numero{

    padding:12px;
    border-radius:10px;
    border:none;
    background:#5f7c53;
    color:white;
    cursor:pointer;
    font-size:16px;

}

.reservado{

    background:#aaa;
    cursor:not-allowed;

}


</style>

</head>


<body>


<div class="card">

<h1>🎟️ Rifa Carlos & Caroline</h1>

<p>
Escolha seu número<br>
Valor: <b>R$ 10,00</b>
</p>


<div class="numeros" id="numeros">

Carregando números...

</div>


</div>


<script type="module">


import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import { 
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyB9wtBnxQd7E_GVjb-E5E38s_PcqiGoDm8",

authDomain: "casamento-carlos-caroline.firebaseapp.com",

projectId: "casamento-carlos-caroline",

storageBucket: "casamento-carlos-caroline.firebasestorage.app",

messagingSenderId: "565370188929",

appId: "1:565370188929:web:bf5bb21e3a6067801bc980"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const area = document.getElementById("numeros");


const consulta = await getDocs(collection(db,"Rifa"));


area.innerHTML="";


consulta.forEach((doc)=>{


let dados = doc.data();


let botao = document.createElement("button");


botao.innerHTML = String(dados.numero).padStart(3,"0");


botao.className="numero";


if(dados.status=="reservado"){

botao.className="numero reservado";

botao.disabled=true;

}else{

    botao.onclick = () => {

        alert("Você escolheu o número " + String(dados.numero).padStart(3,"0"));

    };
}


area.appendChild(botao);


});


</script>


</body>

</html>
