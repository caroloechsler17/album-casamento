<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Álbum de Fotos - Carlos e Caroline</title>


<style>

body{
font-family:Arial,sans-serif;
background:#f7f7f7;
text-align:center;
padding:20px;
}


h1{
color:#444;
}


.galeria{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
max-width:1000px;
margin:auto;

}


.galeria img{

width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
background:white;
cursor:pointer;

}


a{

text-decoration:none;

}


</style>

</head>


<body>


<h1>📸 Álbum de Fotos</h1>

<p>
Fotos compartilhadas pelos convidados
</p>


<div id="galeria" class="galeria">

Carregando fotos...

</div>



<script>


const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwl_8i_T-DFmk63_CckA8yiTjvxvE9d50DqEDy8tsshFScFeAf66UmHD-F1Td753U6aTQ/exec";



fetch(URL_SCRIPT)

.then(res=>res.json())

.then(fotos=>{


const galeria =
document.getElementById("galeria");


galeria.innerHTML="";


if(fotos.length===0){

galeria.innerHTML=
"Nenhuma foto enviada ainda.";

return;

}


fotos.reverse().forEach(foto=>{


const imagem =
document.createElement("img");


imagem.src=foto.url;


imagem.onclick=function(){

window.open(foto.url,"_blank");

};


galeria.appendChild(imagem);


});


})


.catch(()=>{

document.getElementById("galeria").innerHTML=
"Erro ao carregar fotos.";

});


</script>


</body>

</html>
