<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Álbum de Fotos - Carlos e Caroline</title>
  
<style>

body{
font-family:Arial,sans-serif;
background:#f7f7f7;
text-align:center;
padding:20px;
}


h1{
color:#444;
}


.galeria{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
max-width:1000px;
margin:auto;

}


.galeria img{

width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
cursor:pointer;

}



#visualizador{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:10;

}


#fotoGrande{

max-width:90%;
max-height:85%;
border-radius:10px;

}


.fechar{

position:absolute;
top:20px;
right:30px;
font-size:40px;
color:white;
cursor:pointer;

}


.seta{

position:absolute;
top:50%;
font-size:50px;
color:white;
cursor:pointer;
user-select:none;

}


.esquerda{
left:20px;
}


.direita{
right:20px;
}

.voltar{

display:inline-block;
margin:20px;
background:#5f7c53;
color:white;
padding:10px 18px;
border-radius:20px;
text-decoration:none;
font-size:16px;

}
  
</style>

</head>


<body>

<a class="voltar" href="index.html">← Voltar</a>

<h1>📸 Álbum de Fotos</h1>

<p>
Fotos compartilhadas pelos convidados
</p>


<div id="galeria" class="galeria">
Carregando fotos...
</div>



<div id="visualizador">

<div class="fechar" onclick="fechar()">×</div>

<div class="seta esquerda" onclick="anterior()">❮</div>

<img id="fotoGrande">

<div class="seta direita" onclick="proxima()">❯</div>

</div>



<script>


const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbwl_8i_T-DFmk63_CckA8yiTjvxvE9d50DqEDy8tsshFScFeAf66UmHD-F1Td753U6aTQ/exec";


let fotos=[];
let atual=0;



fetch(URL_SCRIPT)

.then(res=>res.json())

.then(dados=>{


fotos=dados.reverse();


const galeria=document.getElementById("galeria");

galeria.innerHTML="";


fotos.forEach((foto,index)=>{


const img=document.createElement("img");

img.src=foto.url;


img.onclick=function(){

abrir(index);

};


galeria.appendChild(img);


});


});




function abrir(index){

atual=index;

document.getElementById("fotoGrande").src=
fotos[atual].url;


document.getElementById("visualizador").style.display="flex";

}



function fechar(){

document.getElementById("visualizador").style.display="none";

}



function proxima(){

atual++;

if(atual>=fotos.length){
atual=0;
}

document.getElementById("fotoGrande").src=
fotos[atual].url;

}



function anterior(){

atual--;

if(atual<0){
atual=fotos.length-1;
}

document.getElementById("fotoGrande").src=
fotos[atual].url;

}



</script>


</body>

</html>
