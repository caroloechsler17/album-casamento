<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Rifa - Carlos e Caroline</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f6f5f2;
    text-align:center;
    padding:30px;
}

h1{
    color:#48613c;
}

button{

    background:#5f7c53;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;

}

button:hover{

    background:#48613c;

}


.voltar{

position:fixed;
top:20px;
left:20px;
background:#5f7c53;
color:white;
padding:10px 18px;
border-radius:20px;
text-decoration:none;

}


table{

display:none;

}


</style>

</head>


<body>


<a class="voltar" href="index.html">← Voltar</a>


<h1>📄 Gerar PDF da Rifa</h1>

<p>
Clique abaixo para gerar a lista dos números reservados.
</p>


<button onclick="gerarPDF()">

Gerar PDF

</button>



<table id="tabela">

<thead>

<tr>

<th>Número</th>
<th>Nome</th>
<th>Telefone</th>

</tr>

</thead>


<tbody id="dados">

</tbody>

</table>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs

}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyB9wtBnxQd7E_GVjb-E5E38s_PcqiGoDm8",

authDomain: "casamento-carlos-caroline.firebaseapp.com",

projectId: "casamento-carlos-caroline",

storageBucket: "casamento-carlos-caroline.firebasestorage.app",

messagingSenderId: "565370188929",

appId: "1:565370188929:web:bf5bb21e3a6067801bc980"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



async function gerarPDF(){


let conteudo = `

<h1 style="text-align:center">

Rifa de Casamento<br>
Carlos ❤️ Caroline

</h1>


<table border="1" width="100%" cellspacing="0" cellpadding="8">

<tr>

<th>Número</th>
<th>Nome</th>
<th>Telefone</th>

</tr>

`;



const snapshot = await getDocs(collection(db,"Rifa"));



snapshot.docs

.sort((a,b)=>Number(a.id)-Number(b.id))

.forEach((documento)=>{


const dados=documento.data();


if(dados.status==="reservado"){


conteudo += `

<tr>

<td>${documento.id}</td>

<td>${dados.Nome}</td>

<td>${dados.Telefone}</td>

</tr>

`;

}


});


conteudo += "</table>";



const janela = window.open("","_blank");


janela.document.write(`

<html>

<head>

<title>Rifa</title>

</head>

<body>

${conteudo}

</body>

</html>

`);


janela.document.close();


janela.print();


}



window.gerarPDF=gerarPDF;


</script>


</body>

</html>
