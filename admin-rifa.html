<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administração da Rifa</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f6f5f2;
    padding:20px;
}

h1{
    text-align:center;
    color:#48613c;
}

.container{

    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);

}

table{

    width:100%;
    border-collapse:collapse;
    margin-top:20px;

}

th{

    background:#5f7c53;
    color:white;
    padding:12px;

}

td{

    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;

}

button{

    background:#5f7c53;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;

}

button:hover{

    background:#48613c;

}

.liberar{

    background:#d9534f;

}

.liberar:hover{

    background:#b52b27;

}


.voltar{

position:fixed;
top:20px;
left:20px;
background:#5f7c53;
color:white;
padding:10px 18px;
border-radius:20px;
text-decoration:none;

}


</style>

</head>


<body>


<a class="voltar" href="index.html">← Voltar</a>


<div class="container">

<h1>🎟️ Administração da Rifa</h1>

<table>

<thead>

<tr>

<th>Número</th>
<th>Nome</th>
<th>Telefone</th>
<th>Status</th>
<th>Ações</th>

</tr>

</thead>


<tbody id="tabela">

</tbody>


</table>

</div>



<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
onSnapshot,
doc,
updateDoc

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyB9wtBnxQd7E_GVjb-E5E38s_PcqiGoDm8",

authDomain: "casamento-carlos-caroline.firebaseapp.com",

projectId: "casamento-carlos-caroline",

storageBucket: "casamento-carlos-caroline.firebasestorage.app",

messagingSenderId: "565370188929",

appId: "1:565370188929:web:bf5bb21e3a6067801bc980"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const tabela = document.getElementById("tabela");



onSnapshot(collection(db,"Rifa"),(snapshot)=>{


tabela.innerHTML="";


snapshot.docs

.sort((a,b)=>Number(a.id)-Number(b.id))

.forEach((documento)=>{


const dados=documento.data();

const numero=documento.id;


const linha=document.createElement("tr");



linha.innerHTML=`

<td>${numero}</td>

<td>${dados.Nome || "-"}</td>

<td>${dados.Telefone || "-"}</td>

<td>${dados.status}</td>

<td>

<button onclick="editar('${numero}')">

✏️ Editar

</button>


<button class="liberar" onclick="liberar('${numero}')">

Liberar

</button>


</td>

`;



tabela.appendChild(linha);



});


});



window.editar=function(numero){


const nome=prompt(
"Digite o novo nome:",
""
);


if(nome===null) return;



const telefone=prompt(
"Digite o novo telefone:",
""
);


if(telefone===null) return;



updateDoc(doc(db,"Rifa",numero),{

Nome:nome,
Telefone:telefone

});


alert("Dados atualizados!");



}



window.liberar=function(numero){


if(confirm("Liberar o número "+numero+"?")){


updateDoc(doc(db,"Rifa",numero),{

Nome:"",
Telefone:"",
status:"disponível"

});


alert("Número liberado!");

}


}



</script>


</body>

</html>
