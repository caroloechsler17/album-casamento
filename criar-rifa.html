<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criar Rifa</title>
</head>

<body>

<h1>Criando números da rifa...</h1>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import { 
getFirestore,
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyB9wtBnxQd7E_GVjb-E5E38s_PcqiGoDm8",

authDomain: "casamento-carlos-caroline.firebaseapp.com",

projectId: "casamento-carlos-caroline",

storageBucket: "casamento-carlos-caroline.firebasestorage.app",

messagingSenderId: "565370188929",

appId: "1:565370188929:web:bf5bb21e3a6067801bc980"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


for(let i = 2; i <= 400; i++){

let numero = String(i).padStart(3,'0');


await setDoc(doc(db,"Rifa",numero),{

numero:i,

valor:10,

Nome:"",

Telefone:"",

status:"disponível"

});

}


document.body.innerHTML = "<h1>Rifa criada com sucesso! 🎉</h1>";

</script>

</body>
