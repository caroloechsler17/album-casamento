<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Mensagens - Carlos e Caroline</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f6f5f2;
    padding:20px;
}

.container{

    max-width:900px;
    margin:auto;

}

h1{

    text-align:center;
    color:#48613c;

}


.mensagem{

    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);

}


.nome{

    font-weight:bold;
    color:#48613c;
    font-size:18px;

}


button{

    background:#5f7c53;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;

}


button:hover{

    background:#48613c;

}


.voltar{

display:inline-block;
margin-bottom:20px;
background:#5f7c53;
color:white;
padding:10px 18px;
border-radius:20px;
text-decoration:none;

}


</style>

</head>


<body>


<div class="container">


<a class="voltar" href="index.html">← Voltar</a>


<h1>💌 Administração das Mensagens</h1>


<div id="lista">

Carregando...

</div>


</div>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
onSnapshot,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyB9wtBnxQd7E_GVjb-E5E38s_PcqiGoDm8",

authDomain: "casamento-carlos-caroline.firebaseapp.com",

projectId: "casamento-carlos-caroline",

storageBucket: "casamento-carlos-caroline.firebasestorage.app",

messagingSenderId: "565370188929",

appId: "1:565370188929:web:bf5bb21e3a6067801bc980"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const lista = document.getElementById("lista");



onSnapshot(collection(db,"Mensagens"),(snapshot)=>{


lista.innerHTML="";


snapshot.forEach((documento)=>{


const dados=documento.data();



lista.innerHTML += `


<div class="mensagem">


<div class="nome">

${dados.Nome}

</div>


<p>

${dados.Mensagem}

</p>


<button onclick="editar('${documento.id}','${dados.Mensagem.replace(/'/g,"\\'")}')">

✏️ Editar

</button>


</div>


`;


});


});




window.editar = async function(id,mensagemAtual){


const novaMensagem = prompt(

"Edite a mensagem:",

mensagemAtual

);



if(novaMensagem===null){

return;

}



await updateDoc(doc(db,"Mensagens",id),{

Mensagem:novaMensagem

});


alert("Mensagem atualizada!");


}



</script>


</body>

</html>
