<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mensagens - Carlos & Caroline</title>

<style>

body{

font-family:Arial, Helvetica, sans-serif;
background:#f6f5f2;
padding:20px;

}


.container{

max-width:700px;
margin:auto;

}


h1{

text-align:center;
color:#48613c;

}


.card{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:25px;

}


input, textarea{

width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;

}


textarea{

height:120px;
resize:none;

}


button{

width:100%;
background:#5f7c53;
color:white;
border:none;
padding:15px;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#48613c;

}


.mensagem{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);

}


.nome{

font-weight:bold;
color:#48613c;
font-size:18px;

}


.data{

font-size:12px;
color:#888;

}


.voltar{

display:inline-block;
margin-bottom:20px;
background:#5f7c53;
color:white;
padding:10px 18px;
border-radius:20px;
text-decoration:none;

}


</style>

</head>


<body>


<div class="container">


<a class="voltar" href="index.html">← Voltar</a>


<h1>💌 Mensagens para os Noivos</h1>


<div class="card">


<input 
id="nome"
placeholder="Seu nome">


<textarea
id="mensagem"
placeholder="Escreva uma mensagem para Carlos e Caroline">
</textarea>


<button onclick="enviarMensagem()">

Enviar mensagem 💚

</button>


</div>



<h1>💚 Mensagens dos convidados</h1>


<div id="lista">

Carregando mensagens...

</div>


</div>




<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,
collection,
addDoc,
onSnapshot,
serverTimestamp,
query,
orderBy

}

from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";




const firebaseConfig = {

apiKey: "AIzaSyB9wtBnxQd7E_GVjb-E5E38s_PcqiGoDm8",

authDomain: "casamento-carlos-caroline.firebaseapp.com",

projectId: "casamento-carlos-caroline",

storageBucket: "casamento-carlos-caroline.firebasestorage.app",

messagingSenderId: "565370188929",

appId: "1:565370188929:web:bf5bb21e3a6067801bc980"

};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



window.enviarMensagem = async function(){


const nome = document.getElementById("nome").value.trim();

const mensagem = document.getElementById("mensagem").value.trim();



if(nome==="" || mensagem===""){

alert("Preencha seu nome e sua mensagem.");

return;

}



await addDoc(collection(db,"Mensagens"),{


Nome:nome,

Mensagem:mensagem,

Data:serverTimestamp()


});



alert("Mensagem enviada com sucesso! 💚");


document.getElementById("nome").value="";

document.getElementById("mensagem").value="";


}




const lista = document.getElementById("lista");



const consulta = query(

collection(db,"Mensagens"),

orderBy("Data","desc")

);



onSnapshot(consulta,(snapshot)=>{


lista.innerHTML="";


snapshot.forEach((doc)=>{


const dados = doc.data();



lista.innerHTML += `


<div class="mensagem">


<div class="nome">

${dados.Nome}

</div>


<p>

${dados.Mensagem}

</p>


</div>


`;



});


});



</script>


</body>

</html>
